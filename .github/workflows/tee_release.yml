# Builds Linux bundles of this fork on GitHub-hosted runners and publishes them
# as a GitHub release. Upstream's release.yml needs Zed's own runners and
# secrets, so it can't run here.
#
# Release by pushing a tag like `tee-v0.1.0`, or run this workflow manually
# from the Actions tab with the tag to create.
name: Tee release

on:
  push:
    tags:
      - "tee-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release under, e.g. tee-v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: tee-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle_linux:
    if: github.repository == 'TsaH0/Tee'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 ships clang 18, which Zed's WebRTC dependency needs.
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
      # Built into the binary: disables auto-update, which would otherwise
      # replace this fork with upstream Zed.
      ZED_UPDATE_EXPLANATION: "Download the latest release from https://github.com/TsaH0/Tee/releases to update."
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install build dependencies
        run: ./script/linux
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Bundle
        run: ./script/bundle-linux --skip-sentry
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-linux-${{ matrix.arch }}.tar.gz
          path: target/release/zed-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      - name: Upload remote server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-remote-server-linux-${{ matrix.arch }}.gz
          path: target/zed-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  publish:
    needs: bundle_linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tee $TAG" \
            --notes "Linux builds of Tee (Zed with extended Helix mode) from ${GITHUB_SHA::7}.

          Install or update with:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/TsaH0/Tee/$TAG/script/install-tee.sh | sh
          \`\`\`"
