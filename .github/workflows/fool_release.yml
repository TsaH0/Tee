# Builds Linux bundles of this fork on GitHub-hosted runners and publishes them
# as a GitHub release. Upstream's release.yml needs Zed's own runners and
# secrets, so it can't run here.
#
# Every push to main publishes a release tagged `fool-v0.1.<run number>`. You
# can also push a tag like `fool-v0.2.0`, or run this workflow manually from the
# Actions tab with the tag to create.
name: Fool release

on:
  push:
    branches:
      - main
    tags:
      - "fool-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release under, e.g. fool-v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: fool-release-${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('fool-v0.1.{0}', github.run_number) }}
  cancel-in-progress: false

jobs:
  bundle_linux:
    if: github.repository == 'TsaH0/Tee'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 ships clang 18, which Zed's WebRTC dependency needs.
          # Only x86_64 is built; add `ubuntu-24.04-arm` with `arch: aarch64`
          # here to also release ARM builds.
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
      # GitHub-hosted runners have 4 cores and limited disk, and Sentry symbols
      # aren't uploaded here, so build with more codegen units and no debug info
      # to finish well within the job time limit.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_DEBUG: 0
      # Built into the binary: disables auto-update, which would otherwise
      # replace this fork with upstream Zed.
      ZED_UPDATE_EXPLANATION: "Download the latest release from https://github.com/TsaH0/Tee/releases to update."
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - name: Check out
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install build dependencies
        run: ./script/linux
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Bundle
        run: ./script/bundle-linux --skip-sentry
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-linux-${{ matrix.arch }}.tar.gz
          path: target/release/zed-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      - name: Upload remote server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-remote-server-linux-${{ matrix.arch }}.gz
          path: target/zed-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  publish:
    needs: bundle_linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('fool-v0.1.{0}', github.run_number) }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fool $TAG" \
            --notes "Linux builds of Fool (Zed with extended Helix mode) from ${GITHUB_SHA::7}.

          Install or update with:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/TsaH0/Tee/$TAG/script/install-fool.sh | sh
          \`\`\`"
